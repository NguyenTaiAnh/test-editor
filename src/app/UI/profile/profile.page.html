<main>
    <section class="profile-info">
        <h2>User Information</h2>
        <p>Name: John Doe</p>
        <p>Email: john.doe/p>
        <p>Location: New York, USA</p>
    </section>
    <section class="profile-picture">
        <h2>Profile Picture</h2>
<!--        <img src="" alt="Profile Picture">-->
    </section>
    <section class="profile-settings">
        <h2>Settings</h2>
        <button>Edit Profile</button>
        <button>Change Password</button>
    </section>
</main>
<form [formGroup]="form" (ngSubmit)="onsubmit()"   >
  <input type="text" class="border-2 border-amber-950" formControlName="username" required>
  <button type="submit">submit</button>
</form>

<form [formGroup]="formArr" (ngSubmit)="onsubmitArr()" >
  <div formArrayName="items">
    <div *ngFor="let item of items1.controls; let i = index" [formGroupName]="i" >
      <input formControlName="name" type="text">
      <button (click)="removeItem(i)">remove item</button>
      <button type="submit">submit</button>
    </div>
  </div>
  <button (click)="addItem()">click add item name</button>
</form>
